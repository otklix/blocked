<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 Отправка местоположения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        h2 {
            color: #1a1a2e;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        #status {
            font-size: 16px;
            padding: 20px;
            border-radius: 12px;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .loading {
            color: #0066ff;
            background: #e8f0fe;
        }
        .success {
            color: #0d7c3f;
            background: #e6f7ed;
        }
        .error {
            color: #d93025;
            background: #fce8e6;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0066ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .address {
            font-size: 14px;
            color: #333;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">📍</div>
    <h2>Определение местоположения</h2>
    <p class="subtitle">Это нужно для отправки адреса</p>
    <div id="status" class="loading">
        <div class="loader"></div>
        Запрашиваем доступ...
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const REPO = 'ТВОЙ_НИК/НАЗВАНИЕ_РЕПО';  // ← ИЗМЕНИ!
    const GITHUB_TOKEN = 'ghp_ТВОЙ_ТОКЕН';    // ← ИЗМЕНИ!
    
    const statusEl = document.getElementById('status');
    
    if (!code) {
        statusEl.innerHTML = '❌ Неверная ссылка';
        statusEl.className = 'error';
        return;
    }
    
    if (!navigator.geolocation) {
        statusEl.innerHTML = '❌ Браузер не поддерживает геолокацию';
        statusEl.className = 'error';
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        async function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            statusEl.innerHTML = '<div class="loader"></div>Отправляем координаты...';
            statusEl.className = 'loading';
            
            try {
                // Получаем адрес через OpenStreetMap
                const addrRes = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=18`
                );
                const addrData = await addrRes.json();
                const address = addrData.display_name || 'Адрес не найден';
                
                // Создаём Issue в GitHub
                const response = await fetch(
                    `https://api.github.com/repos/${REPO}/issues`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `token ${GITHUB_TOKEN}`
                        },
                        body: JSON.stringify({
                            title: `📍 Геолокация: ${code}`,
                            body: `**Код:** ${code}\n\n**Адрес:** ${address}\n\n**Координаты:** ${lat}, ${lon}\n\n**Карта:** https://www.google.com/maps?q=${lat},${lon}`
                        })
                    }
                );
                
                if (response.ok) {
                    statusEl.innerHTML = `
                        ✅ Отправлено!\n\n
                        📍 ${address}
                    `;
                    statusEl.className = 'success';
                } else {
                    statusEl.innerHTML = '❌ Ошибка отправки';
                    statusEl.className = 'error';
                }
            } catch (error) {
                statusEl.innerHTML = '❌ Ошибка соединения';
                statusEl.className = 'error';
            }
        },
        function(error) {
            statusEl.innerHTML = '❌ Разрешите доступ к геолокации в браузере';
            statusEl.className = 'error';
        }
    );
</script>

</body>
</html>
